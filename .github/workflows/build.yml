name: build

# macOS 上打不出 Windows 包（见 README「打包成独立应用」）。手边没有 Windows
# 电脑时，想确认「Windows 上能编译、测试能过、安装包能出」，只能交给 CI。
#
# macOS 这一路只跑测试：本机开发就在 Mac 上，打包在本机做就行。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 前端测试
        run: npm test

      - name: Rust 测试
        run: cargo test
        working-directory: src-tauri

      - name: 打包 Windows 安装包（msi + exe）
        if: runner.os == 'Windows'
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: gantt-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
